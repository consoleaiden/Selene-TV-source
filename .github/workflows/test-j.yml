name: Smoke Test J

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  big:
    runs-on: ubuntu-latest
    steps:
      - name: Big secret (3.7KB)
        env:
          BAR: ${{ secrets.TEST_SECRET_3KB }}
        run: echo "variant J big ok"

  small:
    runs-on: ubuntu-latest
    steps:
      - name: Small secret (100B)
        env:
          BAR: ${{ secrets.TEST_SECRET_SMALL }}
        run: echo "variant J small ok"
