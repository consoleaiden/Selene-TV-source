name: Build & Publish APK

# 每次 push 到 master 自动构建 debug APK 并发布到 GitHub Release（tag = v{versionName}），
# 同版本重复推送时删除旧 Release 后重建，保证 Release 始终对应最新提交。
#
# 签名：release-key.jks.gpg（GPG AES256 对称加密后的密钥库，随仓库提交）+ secret
#   RELEASE_KEYSTORE_PASSPHRASE = 解密密码（同时作为 keystore 密码）。
# 构建时解密出 release-key.jks 与 key.properties，debug 构建也使用稳定签名。
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable signing keys (gpg decrypt)
        env:
          PASSPHRASE: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
        run: |
          set -e
          gpg -d --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" release-key.jks.gpg > release-key.jks
          printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=selenetv\nkeyPassword=%s\n' "$PASSPHRASE" "$PASSPHRASE" > key.properties
          echo "signing keys restored (stable release signing for debug build)"

      - name: Build debug APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        id: ver
        run: |
          set -e
          VN=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          VC=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "out/SeleneTV-v${VN}-arm64-v8a-debug.apk"
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk "out/SeleneTV-v${VN}-armeabi-v7a-debug.apk"
          ls -l out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="v${{ steps.ver.outputs.vn }}"
          gh release delete "$TAG" -y --cleanup-tag --repo "$REPO" 2>/dev/null || true
          gh release create "$TAG" out/*.apk \
            --repo "$REPO" \
            --title "SeleneTV v${{ steps.ver.outputs.vn }} (versionCode ${{ steps.ver.outputs.vc }})" \
            --notes "自动构建发布 (run #${{ github.run_number }}, commit ${{ github.sha }})，稳定签名可覆盖安装" \
            --latest
