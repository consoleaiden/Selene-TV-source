name: Build & Publish Release APK

# 手动触发的正式版（release）构建：assembleRelease（含 R8 混淆 + 资源收缩），
# 发布到独立的 tag v{versionName}-release，与 debug 工作流的 tag v{versionName} 互不覆盖。
#
# 签名：release-key.jks.gpg（GPG AES256 对称加密后的密钥库，随仓库提交）+ secret
#   RELEASE_KEYSTORE_PASSPHRASE = 解密密码（同时作为 keystore 密码）
# 构建时解密出 release-key.jks 与 key.properties，用稳定正式签名（可覆盖安装升级不丢数据）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore signing keys (gpg decrypt)
        id: signing
        env:
          PASSPHRASE: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
        run: |
          set -e
          gpg -d --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" release-key.jks.gpg > release-key.jks
          printf 'storeFile=release-key.jks\nstorePassword=%s\nkeyAlias=selenetv\nkeyPassword=%s\n' "$PASSPHRASE" "$PASSPHRASE" > key.properties
          echo "signed=release" >> "$GITHUB_OUTPUT"
          echo "signing keys restored (stable release signing)"

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        id: ver
        run: |
          set -e
          VN=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          VC=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/SeleneTV-v${VN}-arm64-v8a-release.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "out/SeleneTV-v${VN}-armeabi-v7a-release.apk"
          ls -l out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="v${{ steps.ver.outputs.vn }}-release"
          if [ "${{ steps.signing.outputs.signed }}" = "release" ]; then
            SIGN_NOTE="稳定正式签名（可覆盖安装升级）"
          else
            SIGN_NOTE="⚠️ 未配置签名 secrets，本次使用 debug 签名"
          fi
          gh release delete "$TAG" -y --cleanup-tag --repo "$REPO" 2>/dev/null || true
          gh release create "$TAG" out/*.apk \
            --repo "$REPO" \
            --title "SeleneTV v${{ steps.ver.outputs.vn }} Release (versionCode ${{ steps.ver.outputs.vc }})" \
            --notes "正式版构建 (run #${{ github.run_number }}, commit ${{ github.sha }})。签名：${SIGN_NOTE}" \
            --latest=false
