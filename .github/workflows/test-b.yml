name: Smoke Test B

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Restore stable signing keys from secrets
        id: signing
        env:
          SIGNING_PROPS_B64: ${{ secrets.RELEASE_SIGNING_PROPS_B64 }}
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_PROPS_B64" ] && [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release-key.jks
            echo "$SIGNING_PROPS_B64" | base64 -d > key.properties
            echo "signed=release" >> "$GITHUB_OUTPUT"
            echo "signing keys restored from secrets (stable release signing)"
          else
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "WARN: signing secrets not set"
          fi

      - name: Echo
        run: echo "variant B ok, signed=${{ steps.signing.outputs.signed }}"
